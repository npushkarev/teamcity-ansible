---
- name: Pull TeamCity images from the registry
  when: teamcity_image_source == 'registry'
  block:
    - name: Log in to the Docker registry
      ansible.builtin.command:
        argv:
          - docker
          - login
          - "{{ teamcity_registry_host }}"
          - --username
          - "{{ teamcity_registry_user }}"
          - --password-stdin
        stdin: "{{ teamcity_registry_password }}"
        stdin_add_newline: true
      register: teamcity_registry_login
      changed_when: false
      failed_when: false
      no_log: true

    # Пароль идёт через stdin и в ответ Docker не попадает — текст ошибки показываем.
    - name: Docker registry login succeeded
      ansible.builtin.assert:
        that: teamcity_registry_login.rc == 0
        fail_msg: |
          docker login {{ teamcity_registry_host }} (пользователь {{ teamcity_registry_user }}) не прошёл:
          {{ (teamcity_registry_login.stderr | default('')) | regex_replace(teamcity_registry_password | regex_escape, '***') if teamcity_registry_password | length > 0 else teamcity_registry_login.stderr | default('') }}
          - unauthorized / 401: проверьте vault_proget_registry_user и vault_proget_registry_password
            (ansible-vault edit inventory/vault.yml); для API-ключа ProGet логин — api, пароль — ключ;
          - x509 / certificate signed by unknown authority: на ВМ нет корпоративного УЦ (00 запускали без
            files/ca/ca.crt) — либо поставьте УЦ, либо teamcity_registry_insecure: true в hosts.yml;
          - timeout / no such host: ВМ не видит {{ teamcity_registry_host }} (DNS, сеть).
        quiet: true

    - name: Pull TeamCity images with Docker Compose
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ teamcity_deploy_dir }}/compose.yaml"
          - pull
        chdir: "{{ teamcity_deploy_dir }}"
      register: teamcity_registry_pull
      changed_when: >-
        'Downloaded newer image' in (teamcity_registry_pull.stderr ~ teamcity_registry_pull.stdout)
        or 'Pull complete' in (teamcity_registry_pull.stderr ~ teamcity_registry_pull.stdout)

    - name: Start TeamCity containers from registry images
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ teamcity_deploy_dir }}/compose.yaml"
          - up
          - --no-build
          - -d
        chdir: "{{ teamcity_deploy_dir }}"
      register: teamcity_compose_up
      changed_when: >-
        'Started' in (teamcity_compose_up.stderr ~ teamcity_compose_up.stdout)
        or 'Created' in (teamcity_compose_up.stderr ~ teamcity_compose_up.stdout)
        or 'Recreated' in (teamcity_compose_up.stderr ~ teamcity_compose_up.stdout)
      no_log: true
      when: teamcity_start_containers | bool
  always:
    - name: Log out from the Docker registry
      ansible.builtin.command:
        argv:
          - docker
          - logout
          - "{{ teamcity_registry_host }}"
      changed_when: false
      failed_when: false
      no_log: true
