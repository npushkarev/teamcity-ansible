---
# Чистая установка TeamCity 2026.2 на новый Debian 13 из образов ProGet.
# Внешние коллекции не нужны: Docker и Compose v2 ставятся из репозитория Debian.
#
# Запуск (первый SSH-вход может быть парольным):
#   ansible-playbook -i inventory/teamcity-proget.yml playbooks/53-teamcity-proget.yml \
#     --limit <имя ВМ> --ask-pass --ask-vault-pass
- name: Prepare fresh Debian and deploy TeamCity from ProGet
  hosts: teamcity
  become: true
  gather_facts: false
  vars:
    teamcity_node_kind: server
    teamcity_image_source: registry
    teamcity_apt_proxy_env:
      http_proxy: "{{ platform_proxy_url | default('') }}"
      https_proxy: "{{ platform_proxy_url | default('') }}"
      no_proxy: "{{ platform_no_proxy | default('localhost,127.0.0.1,::1,.inc.elara.local,172.17.0.0/16') }}"
    # Настройки Docker daemon (DNS, логи, nofile) — в defaults роли teamcity-offline,
    # чтобы их можно было переопределить из inventory.
  pre_tasks:
    # Те же секреты, что читает 00: inventory/vault.yml (пароли PostgreSQL и ProGet).
    - name: Read inventory/vault.yml when present
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/vault.yml"
      when: query('fileglob', inventory_dir ~ '/vault.yml') | length > 0

    - name: Require --limit to avoid touching other hosts
      ansible.builtin.assert:
        that: ansible_limit is defined
        fail_msg: Run with --limit <host> so other machines are not changed.
        quiet: true
      run_once: true

    # raw не поддерживает environment, поэтому прокси передаётся прямо в команду.
    - name: Check Python on a fresh Debian host
      ansible.builtin.raw: command -v python3 >/dev/null 2>&1 && dpkg -s python3-apt >/dev/null 2>&1
      register: teamcity_python_check
      changed_when: false
      failed_when: false

    - name: Install Python for Ansible
      ansible.builtin.raw: >-
        export DEBIAN_FRONTEND=noninteractive
        http_proxy={{ teamcity_apt_proxy_env.http_proxy | quote }}
        https_proxy={{ teamcity_apt_proxy_env.https_proxy | quote }}
        no_proxy={{ teamcity_apt_proxy_env.no_proxy | quote }};
        apt-get update -qq && apt-get install -y -qq python3 python3-apt
      no_log: "{{ platform_proxy_url | default('') | length > 0 }}"
      when: teamcity_python_check.rc != 0

    - name: Gather facts after Python bootstrap
      ansible.builtin.setup:

    # В Debian 12 есть только Compose v1 (1.29); команды "docker compose" там нет.
    - name: Require Debian 13
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Debian'
          - ansible_distribution_major_version == '13'
        fail_msg: >-
          Only Debian 13 is supported (Compose v2 from Debian repositories),
          got {{ ansible_distribution }} {{ ansible_distribution_version }}

    # Неверное значение сломает daemon.json, и Docker (вместе с TeamCity) не запустится.
    - name: Validate Docker daemon settings before writing daemon.json
      ansible.builtin.assert:
        that:
          - teamcity_docker_dns is sequence and teamcity_docker_dns is not string
          - teamcity_docker_dns_search is sequence and teamcity_docker_dns_search is not string
          - teamcity_docker_dns | map('string') | select('match', '^[0-9A-Fa-f:.]+$') | list | length == teamcity_docker_dns | length
          - teamcity_docker_nofile | int > 0
        fail_msg: >-
          teamcity_docker_dns must be a YAML list of IP addresses and teamcity_docker_dns_search
          a list of domains, e.g. [172.17.0.2]. On the command line use JSON:
          -e '{"teamcity_docker_dns": []}'
        quiet: true

    # daemon.json пишется ДО установки, чтобы Docker сразу стартовал с этими настройками.
    - name: Ensure Docker configuration directory exists
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Read existing Docker daemon configuration
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: teamcity_daemon_json_raw
      failed_when: false

    - name: Merge TeamCity Docker daemon settings into existing configuration
      ansible.builtin.set_fact:
        teamcity_daemon_json: >-
          {{ (teamcity_daemon_json_raw.content | default('') | b64decode | default('{}', true) | from_json)
             | combine(teamcity_daemon_managed) }}
      vars:
        teamcity_daemon_existing_registries: >-
          {{ (teamcity_daemon_json_raw.content | default('') | b64decode | default('{}', true) | from_json)['insecure-registries'] | default([]) }}
        teamcity_daemon_managed: >-
          {{ {'log-driver': 'json-file',
              'log-opts': {'max-size': teamcity_docker_log_max_size, 'max-file': teamcity_docker_log_max_file | string},
              'default-ulimits': {'nofile': {'Name': 'nofile', 'Soft': teamcity_docker_nofile | int, 'Hard': teamcity_docker_nofile | int}}}
             | combine({'dns': teamcity_docker_dns | map('string') | list, 'dns-search': teamcity_docker_dns_search}
                       if teamcity_docker_dns | length > 0 else {})
             | combine({'insecure-registries': teamcity_daemon_existing_registries
                        + ([teamcity_registry_host] if teamcity_registry_host not in teamcity_daemon_existing_registries else [])}
                       if teamcity_registry_insecure | bool else {}) }}

    - name: Write Docker daemon configuration
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: '0644'
        content: "{{ teamcity_daemon_json | to_nice_json }}\n"
      register: teamcity_daemon_json_file

    - name: Check whether Docker was already installed
      ansible.builtin.stat:
        path: /usr/bin/dockerd
      register: teamcity_dockerd_before

    - name: Install Docker Engine, CLI and Compose v2 from Debian
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - docker.io
          - docker-cli
          - containerd
          - docker-compose
        state: present
        update_cache: true
      environment: "{{ teamcity_apt_proxy_env }}"

    # Перезапуск только если Docker уже работал и его настройки изменились.
    - name: Start Docker with current daemon settings
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: >-
          {{ 'restarted' if (teamcity_dockerd_before.stat.exists and teamcity_daemon_json_file is changed)
             else 'started' }}

    - name: Show Docker and Compose versions
      ansible.builtin.shell: docker --version && docker compose version
      register: teamcity_docker_versions
      changed_when: false

    - name: Docker is ready
      ansible.builtin.debug:
        msg: "{{ teamcity_docker_versions.stdout_lines }}"
  roles:
    - teamcity-offline
