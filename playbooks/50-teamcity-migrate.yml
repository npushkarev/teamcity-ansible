---
# ===========================================================================
# 50 — Всё одной командой: перенос старого TeamCity на новую ВМ + https.
#
#   1. проверки на control node (backup, сертификат, --limit);
#   2. backup и артефакты из migration/ -> ВМ           (= 40-teamcity-backup-upload);
#   3. Docker, образы из ProGet, compose.yaml           (= 53-teamcity-proget, без запуска);
#   4. https: nginx на 443 с сертификатом из files/tls/, http -> https;
#   5. восстановление backup в PostgreSQL (maintainDB), артефакты, адрес сервера https;
#   6. первый запуск с обновлением данных 2018 -> 2026 без ручного подтверждения.
#
# Что положить на control node:
#   migration/TeamCity_Backup.zip      — backup старого TeamCity;
#   migration/artifacts/               — артефакты (необязательно);
#   files/tls/<имя>.cer + <имя>.key    — wildcard-сертификат *.inc.elara.local.
#
# Запуск (после 00 и 01):
#   ansible-playbook playbooks/50-teamcity-migrate.yml --limit <ВМ> --ask-vault-pass
#
# Лицензионное соглашение TeamCity 2026 плейбук принимает сам (запуская его, вы принимаете
# TeamCity License Agreement). Принимать в браузере: teamcity_accept_license_agreement: false.
#
# Повторный запуск безопасен: восстановление (/opt/teamcity-2026/.restored) и первый
# запуск (.upgraded) выполняются один раз; оборвавшийся запуск продолжится с места
# остановки. Тома Docker плейбук никогда не удаляет.
# ===========================================================================

- name: Preflight on control node
  hosts: teamcity
  gather_facts: false
  vars:
    tls_src_dir: "{{ playbook_dir }}/../files/tls"
    tls_crt_files: >-
      {{ query('fileglob', tls_src_dir ~ '/*.crt') + query('fileglob', tls_src_dir ~ '/*.cer')
         + query('fileglob', tls_src_dir ~ '/*.pem') + query('fileglob', tls_src_dir ~ '/*.der') }}
    tls_key_files: "{{ query('fileglob', tls_src_dir ~ '/*.key') }}"
  tasks:
    - name: Read inventory/vault.yml when present (proxy for apt)
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/vault.yml"
      when: query('fileglob', inventory_dir ~ '/vault.yml') | length > 0
      no_log: true

    - name: Require --limit to avoid touching other hosts
      ansible.builtin.assert:
        that: ansible_limit is defined
        fail_msg: Запускайте с --limit <имя ВМ>, чтобы не задеть другие машины.
        quiet: true
      run_once: true

    - name: Certificate and key in files/tls/
      ansible.builtin.assert:
        that:
          - tls_crt_files | length == 1
          - tls_key_files | length == 1
        fail_msg: >-
          В files/tls/ нужно ровно по одному файлу: сертификат (.cer/.crt/.pem/.der) и ключ (.key).
          Сейчас: сертификаты {{ tls_crt_files | map('basename') | list }},
          ключи {{ tls_key_files | map('basename') | list }}.
        quiet: true
      run_once: true

    # Обычно Python уже поставил 00; на голом Debian ставим здесь (raw — без Python).
    - name: Check Python on the target
      ansible.builtin.raw: command -v python3 >/dev/null 2>&1 && dpkg -s python3-apt >/dev/null 2>&1
      register: preflight_python
      changed_when: false
      failed_when: false

    - name: Install Python for Ansible
      ansible.builtin.raw: >-
        export DEBIAN_FRONTEND=noninteractive
        http_proxy={{ platform_proxy_url | default('') | quote }}
        https_proxy={{ platform_proxy_url | default('') | quote }}
        no_proxy={{ platform_no_proxy | default('localhost,127.0.0.1,::1,.inc.elara.local,172.17.0.0/16') | quote }};
        apt-get update -qq && apt-get install -y -qq python3 python3-apt
      no_log: "{{ platform_proxy_url | default('') | length > 0 }}"
      when: preflight_python.rc != 0

# --- 2. Backup на ВМ ----------------------------------------------------------
- name: Upload backup
  ansible.builtin.import_playbook: 40-teamcity-backup-upload.yml

# --- 3. Docker и образы, TeamCity НЕ запускается ------------------------------
# vars здесь важнее inventory: восстановление требует пустых томов, а наружу
# TeamCity виден только через nginx (https).
- name: Docker and TeamCity files
  ansible.builtin.import_playbook: 53-teamcity-proget.yml
  vars:
    teamcity_start_containers: false
    teamcity_bind_address: 127.0.0.1

# --- 4–6. https, восстановление, запуск ---------------------------------------
- name: HTTPS, restore and first start
  hosts: teamcity
  gather_facts: false
  vars:
    site_name: "{{ teamcity_public_name | default(inventory_hostname, true) }}"
    public_url: "https://{{ site_name }}"
    tc_dir: "{{ teamcity_deploy_dir | default('/opt/teamcity-2026', true) }}"
    tc_port: "{{ teamcity_port | default(8111, true) }}"
    tc_project: teamcity-2026
    tc_data_volume: "{{ tc_project }}_server_data"
    tc_datadir: /data/teamcity_server/datadir
    staging_dir: "{{ teamcity_migration_staging_dir | default('/srv/teamcity-migration', true) }}"
    backup_name: "{{ teamcity_migration_backup_name | default('TeamCity_Backup.zip', true) }}"
    restore_marker: "{{ tc_dir }}/.restored"
    upgrade_marker: "{{ tc_dir }}/.upgraded"
    # Обновление 2018 -> 2026 может идти долго: ждём до часа.
    start_wait_retries: 120
    start_wait_delay: 30
    tls_dir: /etc/ssl/elara
    tls_src_dir: "{{ playbook_dir }}/../files/tls"
    tls_crt_src: >-
      {{ (query('fileglob', tls_src_dir ~ '/*.crt') + query('fileglob', tls_src_dir ~ '/*.cer')
          + query('fileglob', tls_src_dir ~ '/*.pem') + query('fileglob', tls_src_dir ~ '/*.der')) | first }}
    tls_key_src: "{{ query('fileglob', tls_src_dir ~ '/*.key') | first }}"
    compose: [docker, compose, --project-directory, "{{ tc_dir }}", -f, "{{ tc_dir }}/compose.yaml"]
  pre_tasks:
    - name: Read inventory/vault.yml when present
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/vault.yml"
      when: query('fileglob', inventory_dir ~ '/vault.yml') | length > 0
      no_log: true

  tasks:
    # =======================================================================
    # 4. https на nginx: http -> https, https -> 127.0.0.1:8111
    # =======================================================================
    - name: "4a. nginx, openssl"
      ansible.builtin.apt:
        name: [nginx, openssl]
        state: present
      environment:
        http_proxy: "{{ platform_proxy_url | default('') }}"
        https_proxy: "{{ platform_proxy_url | default('') }}"
        no_proxy: "{{ platform_no_proxy | default('localhost,127.0.0.1,::1,.inc.elara.local,172.17.0.0/16') }}"

    - name: "4b. Каталог сертификатов"
      ansible.builtin.file:
        path: "{{ tls_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: "4c. Сертификат (как есть)"
      ansible.builtin.copy:
        src: "{{ tls_crt_src }}"
        dest: "{{ tls_dir }}/{{ site_name }}.src"
        owner: root
        group: root
        mode: '0644'

    # .cer бывает в DER (двоичный) — nginx нужен PEM. PEM копируется как есть (с цепочкой).
    - name: "4d. Сертификат в PEM для nginx"
      ansible.builtin.shell: |
        set -eu
        src={{ (tls_dir ~ '/' ~ site_name ~ '.src') | quote }}
        dst={{ (tls_dir ~ '/' ~ site_name ~ '.crt') | quote }}
        if grep -q -- '-----BEGIN CERTIFICATE-----' "$src"; then
          cp "$src" "$dst.new"
        else
          openssl x509 -inform DER -in "$src" -out "$dst.new"
        fi
        chmod 0644 "$dst.new"
        if cmp -s "$dst.new" "$dst"; then rm -f "$dst.new"; echo same; else mv "$dst.new" "$dst"; echo changed; fi
      register: tls_crt
      changed_when: "'changed' in tls_crt.stdout"

    - name: "4e. Ключ"
      ansible.builtin.copy:
        src: "{{ tls_key_src }}"
        dest: "{{ tls_dir }}/{{ site_name }}.key"
        owner: root
        group: root
        mode: '0600'
      no_log: true
      register: tls_key

    - name: "4f. Ключ подходит к сертификату, сертификат действует и подходит к имени"
      ansible.builtin.shell: |
        set -u
        crt={{ (tls_dir ~ '/' ~ site_name ~ '.crt') | quote }}
        key={{ (tls_dir ~ '/' ~ site_name ~ '.key') | quote }}
        openssl pkey -in "$key" -passin pass: -noout 2>/dev/null || { echo "ключ не читается (зашифрован паролем или не PEM)"; exit 1; }
        c=$(openssl x509 -in "$crt" -noout -pubkey | sha256sum)
        k=$(openssl pkey -in "$key" -passin pass: -pubout | sha256sum)
        [ "$c" = "$k" ] || { echo "ключ не от этого сертификата"; exit 1; }
        openssl x509 -in "$crt" -noout -checkend 0 >/dev/null || { echo "сертификат просрочен"; exit 1; }
        openssl x509 -in "$crt" -noout -checkhost {{ site_name | quote }} | grep -q 'does match' \
          || { echo "сертификат не подходит к имени {{ site_name }}"; exit 1; }
        openssl x509 -in "$crt" -noout -subject -enddate
      register: tls_check
      changed_when: false
      failed_when: tls_check.rc != 0

    - name: "4g. Убрать сайт nginx по умолчанию"
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      register: nginx_default

    # Заголовки и WebSocket — по документации TeamCity «Configuring Proxy Server».
    - name: "4h. Сайт nginx для TeamCity"
      ansible.builtin.copy:
        dest: "/etc/nginx/sites-available/{{ site_name }}.conf"
        owner: root
        group: root
        mode: '0644'
        content: |
          # Managed by ansible (50-teamcity-migrate).
          map $http_upgrade $tc_connection_upgrade {
              default upgrade;
              ''      '';
          }

          server {
              listen 80;
              listen [::]:80;
              server_name {{ site_name }};
              return 301 https://$host$request_uri;
          }

          server {
              listen 443 ssl;
              listen [::]:443 ssl;
              http2 on;
              server_name {{ site_name }};
              server_tokens off;

              ssl_certificate     {{ tls_dir }}/{{ site_name }}.crt;
              ssl_certificate_key {{ tls_dir }}/{{ site_name }}.key;
              ssl_protocols TLSv1.2 TLSv1.3;
              ssl_prefer_server_ciphers on;

              # Артефакты любого размера, долгие загрузки и логи.
              client_max_body_size 0;
              proxy_read_timeout 1200;
              proxy_send_timeout 1200;
              proxy_connect_timeout 240;
              proxy_request_buffering off;
              proxy_buffering off;

              access_log /var/log/nginx/{{ site_name }}-access.log;
              error_log  /var/log/nginx/{{ site_name }}-error.log;

              location / {
                  proxy_pass http://127.0.0.1:{{ tc_port }};
                  proxy_http_version 1.1;
                  proxy_set_header Host              $host;
                  proxy_set_header X-Forwarded-Host  $http_host;
                  proxy_set_header X-Forwarded-Proto https;
                  proxy_set_header X-Forwarded-For   $remote_addr;
                  proxy_set_header Upgrade           $http_upgrade;
                  proxy_set_header Connection        $tc_connection_upgrade;

                  # Контейнер ещё не слушает порт — страница «запускается» вместо 502.
                  proxy_intercept_errors off;
                  error_page 502 504 = @starting;
              }

              location @starting {
                  add_header Retry-After 30 always;
                  default_type text/html;
                  return 503 '<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="30"><title>TeamCity starting</title></head><body style="font-family:sans-serif;text-align:center;margin-top:12%"><h2>TeamCity is starting...</h2><p>This page will refresh in 30 seconds.</p></body></html>';
              }
          }
      register: nginx_site

    - name: "4i. Включить сайт"
      ansible.builtin.file:
        src: "/etc/nginx/sites-available/{{ site_name }}.conf"
        dest: "/etc/nginx/sites-enabled/{{ site_name }}.conf"
        state: link
      register: nginx_link

    - name: "4j. Проверка конфига nginx"
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: "4k. nginx запущен"
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: started

    - name: "4l. reload nginx — если сертификат или сайт изменились"
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
      when: >-
        tls_crt is changed or tls_key is changed or nginx_site is changed
        or nginx_link is changed or nginx_default is changed

    # =======================================================================
    # 5. Восстановление (один раз)
    # =======================================================================
    - name: "5a. Восстановление уже выполнялось?"
      ansible.builtin.stat:
        path: "{{ restore_marker }}"
      register: restored

    - name: "5b. Тома TeamCity"
      ansible.builtin.command:
        argv: [docker, volume, ls, -q, --filter, "label=com.docker.compose.project={{ tc_project }}"]
      register: tc_volumes
      changed_when: false

    # Тома есть, метки нет: был ручной запуск или прошлое восстановление оборвалось.
    # Удалять данные плейбук не будет — решение за человеком.
    - name: "5c. Восстанавливать можно только в пустые тома"
      ansible.builtin.assert:
        that: restored.stat.exists or tc_volumes.stdout_lines | length == 0
        fail_msg: >-
          На ВМ уже есть тома {{ tc_volumes.stdout_lines | join(', ') }}, но восстановление
          плейбуком не завершалось (нет {{ restore_marker }}). Это остатки ручного запуска или
          оборвавшегося восстановления. Если данные в них не нужны, на ВМ выполните
          `cd {{ tc_dir }} && docker compose down -v` (удалит базу и данные TeamCity на этой ВМ)
          и запустите плейбук ещё раз. Журнал прошлой попытки: {{ tc_dir }}/restore.log
        quiet: true

    - name: "5d. Восстановление backup"
      when: not restored.stat.exists
      block:
        - name: "5d-1. Образ TeamCity из compose.yaml"
          ansible.builtin.shell: >-
            {{ compose | map('quote') | join(' ') }} config --images | grep -m1 teamcity-server
          register: tc_image
          changed_when: false

        - name: "5d-2. PostgreSQL: создать и дождаться готовности"
          ansible.builtin.command:
            argv: "{{ compose + ['up', '-d', '--wait', 'db'] }}"
          changed_when: true

        - name: "5d-3. Сеть Compose"
          ansible.builtin.shell: >-
            docker inspect -f '{{ "{{" }}range $k, $v := .NetworkSettings.Networks{{ "}}" }}{{ "{{" }}$k{{ "}}" }}{{ "{{" }}end{{ "}}" }}'
            $({{ compose | map('quote') | join(' ') }} ps -q db)
          register: tc_network
          changed_when: false

        # Тома создаются без запуска TeamCity; Data Directory пока пустой.
        - name: "5d-4. Создать тома TeamCity"
          ansible.builtin.command:
            argv: "{{ compose + ['create', 'server'] }}"
          changed_when: true

        # database.properties — подключение к новой базе; драйвер JDBC — в lib/jdbc.
        - name: "5d-5. Подготовить Data Directory: database.properties и драйвер JDBC"
          ansible.builtin.command:
            argv:
              - docker
              - run
              - --rm
              - -i
              - --network
              - none
              - --user
              - '0:0'
              - -v
              - "{{ tc_data_volume }}:{{ tc_datadir }}"
              - -v
              - "{{ tc_dir }}/jdbc:/jdbc-src:ro"
              - --entrypoint
              - sh
              - "{{ tc_image.stdout }}"
              - -ec
              - |
                D={{ tc_datadir }}
                mkdir -p "$D/config" "$D/lib/jdbc"
                cat > "$D/config/database.properties"
                cp /jdbc-src/*.jar "$D/lib/jdbc/"
                chown 1000:1000 "$D" "$D/config" "$D/config/database.properties" "$D/lib"
                chown -R 1000:1000 "$D/lib/jdbc"
                chmod 600 "$D/config/database.properties"
            stdin: |
              connectionUrl=jdbc:postgresql://db:5432/teamcity
              connectionProperties.user=teamcity
              connectionProperties.password={{ vault_teamcity_db_password }}
          no_log: true
          changed_when: true

        # Журнал — только на ВМ: в нём пути и сведения о данных старого сервера.
        - name: "5d-6. maintainDB restore (может идти долго)"
          ansible.builtin.shell: |
            set -o pipefail
            docker run --rm --network {{ tc_network.stdout | trim | quote }} \
              -v {{ (tc_data_volume ~ ':' ~ tc_datadir) | quote }} \
              -v {{ (staging_dir ~ ':/migration:ro') | quote }} \
              --entrypoint /opt/teamcity/bin/maintainDB.sh \
              {{ tc_image.stdout | quote }} \
              restore -A {{ tc_datadir }} -F /migration/{{ backup_name | quote }} \
              -T {{ tc_datadir }}/config/database.properties \
              > {{ (tc_dir ~ '/restore.log') | quote }} 2>&1
          args:
            executable: /bin/bash
          async: 14400
          poll: 30
          register: tc_restore
          changed_when: true
          failed_when: false

        - name: "5d-7. Права на журнал восстановления"
          ansible.builtin.file:
            path: "{{ tc_dir }}/restore.log"
            owner: root
            group: root
            mode: '0600'

        - name: "5d-8. Восстановление прошло успешно"
          ansible.builtin.assert:
            that: tc_restore.rc | default(1) == 0
            fail_msg: >-
              maintainDB restore завершился с ошибкой (код {{ tc_restore.rc | default('?') }}).
              Журнал на ВМ: {{ tc_dir }}/restore.log. Старый сервер не затронут.
              Чтобы повторить с нуля: `cd {{ tc_dir }} && docker compose down -v`, затем плейбук ещё раз.
            quiet: true

        # Артефакты — до первого запуска (иначе переиндексация увидит неполные данные).
        - name: "5d-9. Есть ли артефакты для переноса"
          ansible.builtin.find:
            paths: "{{ staging_dir }}/artifacts"
            file_type: any
          register: tc_artifacts

        - name: "5d-10. Артефакты в Data Directory"
          ansible.builtin.command:
            argv:
              - docker
              - run
              - --rm
              - --network
              - none
              - --user
              - '0:0'
              - -v
              - "{{ tc_data_volume }}:{{ tc_datadir }}"
              - -v
              - "{{ staging_dir }}/artifacts:/source:ro"
              - --entrypoint
              - sh
              - "{{ tc_image.stdout }}"
              - -ec
              - >-
                mkdir -p {{ tc_datadir }}/system/artifacts &&
                cp -a /source/. {{ tc_datadir }}/system/artifacts/ &&
                chown -R 1000:1000 {{ tc_datadir }}/system
          changed_when: true
          when: tc_artifacts.matched | default(0) > 0

        # В backup адрес старого сервера (http://teamcity...). Новый — https://<ВМ>.
        # database.properties пишем заново: restore мог заменить его копией из backup.
        - name: "5d-11. Адрес сервера https и подключение к новой базе"
          ansible.builtin.command:
            argv:
              - docker
              - run
              - --rm
              - -i
              - --network
              - none
              - --user
              - '0:0'
              - -v
              - "{{ tc_data_volume }}:{{ tc_datadir }}"
              - --entrypoint
              - sh
              - "{{ tc_image.stdout }}"
              - -ec
              - |
                D={{ tc_datadir }}
                cat > "$D/config/database.properties"
                chown 1000:1000 "$D/config/database.properties"
                chmod 600 "$D/config/database.properties"
                f="$D/config/main-config.xml"
                test -f "$f"
                if grep -q 'rootURL="' "$f"; then
                  sed -i -E 's#rootURL="[^"]*"#rootURL="{{ public_url }}"#' "$f"
                else
                  sed -i -E '0,/<server([ >])/s##<server rootURL="{{ public_url }}"\1#' "$f"
                fi
                grep -q 'rootURL="{{ public_url }}"' "$f"
            stdin: |
              connectionUrl=jdbc:postgresql://db:5432/teamcity
              connectionProperties.user=teamcity
              connectionProperties.password={{ vault_teamcity_db_password }}
          no_log: true
          changed_when: true

        - name: "5d-12. Отметить восстановление выполненным"
          ansible.builtin.copy:
            dest: "{{ restore_marker }}"
            owner: root
            group: root
            mode: '0644'
            content: |
              restored_from={{ staging_dir }}/{{ backup_name }}
              public_url={{ public_url }}

    # =======================================================================
    # 6. Первый запуск: данные 2018 обновляются до 2026 без страницы
    #    подтверждения обновления (teamcity.startup.maintenance=false — только
    #    на этот запуск). Если оборвался — повторный запуск плейбука продолжит.
    # =======================================================================
    - name: "6a. Первый запуск уже выполнялся?"
      ansible.builtin.stat:
        path: "{{ upgrade_marker }}"
      register: upgraded

    - name: "6. Первый запуск и обновление данных"
      when: not upgraded.stat.exists
      block:
        - name: "6b. Параметры первого запуска"
          ansible.builtin.copy:
            dest: "{{ tc_dir }}/upgrade.override.yaml"
            owner: root
            group: root
            mode: '0644'
            content: |
              # Временный файл 50-teamcity-migrate: обновить данные без подтверждения.
              services:
                server:
                  environment:
                    TEAMCITY_SERVER_OPTS: -Dteamcity.startup.maintenance=false

        - name: "6c. Запуск TeamCity с обновлением данных"
          ansible.builtin.command:
            argv: "{{ compose + ['-f', tc_dir ~ '/upgrade.override.yaml', 'up', '-d', 'db', 'server'] }}"
          register: tc_first_up
          changed_when: >-
            'Started' in (tc_first_up.stderr ~ tc_first_up.stdout)
            or 'Recreated' in (tc_first_up.stderr ~ tc_first_up.stdout)

        # Вывод: "<код> <url> | <последний этап запуска из журнала TeamCity>".
        - name: "6d. Ждём запуска TeamCity (обновление данных может идти долго)"
          ansible.builtin.shell: |
            set -u
            code=$(curl -s -o /dev/null -w '%{http_code} %{url_effective}' -L http://127.0.0.1:{{ tc_port }}/login.html)
            stage=$({{ compose | map('quote') | join(' ') }} exec -T server \
              sh -c 'grep "Current stage:" /opt/teamcity/logs/teamcity-server.log | tail -n 1' 2>/dev/null \
              | sed 's/.*Current stage: //')
            echo "$code | $stage"
          register: tc_up
          changed_when: false
          failed_when: false
          until: >-
            (tc_up.stdout is match('^200 ') and '/mnt' not in tc_up.stdout.split('|')[0])
            or 'license agreement' in tc_up.stdout
          retries: "{{ start_wait_retries }}"
          delay: "{{ start_wait_delay }}"

        # По умолчанию (teamcity_accept_license_agreement не false) тот, кто запускает плейбук, принимает
        # TeamCity License Agreement (как кнопка «Accept» на странице обслуживания).
        # Вход — по токену Super user из журнала сервера; токен не выводится.
        - name: "6e. Принять лицензионное соглашение TeamCity (teamcity_accept_license_agreement)"
          ansible.builtin.shell: |
            set -eu
            base=http://127.0.0.1:{{ tc_port }}
            token=$({{ compose | map('quote') | join(' ') }} logs server 2>/dev/null \
              | grep -o 'Super user authentication token: [0-9]*' | tail -n 1 | awk '{print $NF}')
            [ -n "$token" ] || { echo "нет токена Super user в журнале сервера"; exit 1; }
            jar=$(mktemp); trap 'rm -f "$jar"' EXIT
            csrf=$(curl -s -c "$jar" -b "$jar" "$base/mnt" \
              | grep -o 'name="tc-csrf-token" content="[^"]*"' | head -n 1 | sed 's/.*content="//; s/"$//')
            r=$(curl -s -c "$jar" -b "$jar" -X POST -H "X-TC-CSRF-Token: $csrf" \
              --data-urlencode "token=$token" "$base/mnt/do/authenticate")
            [ "$r" = OK ] || { echo "вход по токену не удался: $r"; exit 1; }
            r=$(curl -s -c "$jar" -b "$jar" -X POST -H "X-TC-CSRF-Token: $csrf" "$base/mnt/do/acceptLicenseAgreement")
            echo "$r"
          register: tc_accept
          changed_when: true
          when:
            - "'license agreement' in tc_up.stdout"
            - teamcity_accept_license_agreement | default(true) | bool

        - name: "6e. НУЖНО ДЕЙСТВИЕ: принять лицензионное соглашение TeamCity в браузере"
          ansible.builtin.debug:
            msg:
              - "TeamCity 2026 ждёт принятия лицензионного соглашения JetBrains."
              - "1. Откройте {{ public_url }}"
              - "2. Войдите как Super user. Токен — на ВМ:"
              - "   docker compose -f {{ tc_dir }}/compose.yaml logs server | grep 'Super user authentication token' | tail -n 1"
              - "3. Примите соглашение. Дальше обновление данных пойдёт само, плейбук ждёт до часа."
              - "Чтобы принимать автоматически, уберите teamcity_accept_license_agreement: false."
          when:
            - "'license agreement' in tc_up.stdout"
            - not (teamcity_accept_license_agreement | default(true) | bool)

        - name: "6f. Ждём, пока TeamCity обновит данные и запустится"
          ansible.builtin.shell: |
            curl -s -o /dev/null -w '%{http_code} %{url_effective}' -L http://127.0.0.1:{{ tc_port }}/login.html
          register: tc_up2
          changed_when: false
          failed_when: false
          until: tc_up2.stdout is match('^200 ') and '/mnt' not in tc_up2.stdout
          retries: "{{ start_wait_retries }}"
          delay: "{{ start_wait_delay }}"
          when: "'license agreement' in tc_up.stdout"

        - name: "6g. TeamCity запустился (не на странице обслуживания)"
          ansible.builtin.assert:
            that:
              - (tc_up2.stdout | default(tc_up.stdout)) is match('^200 ')
              - "'/mnt' not in (tc_up2.stdout | default(tc_up.stdout)).split('|')[0]"
            fail_msg: >-
              TeamCity не вышел в рабочий режим ({{ tc_up2.stdout | default(tc_up.stdout) }}).
              Откройте {{ public_url }} или смотрите на ВМ:
              docker compose -f {{ tc_dir }}/compose.yaml logs --tail 200 server.
              После исправления просто запустите плейбук ещё раз.
            quiet: true

        # Обычный режим: следующее обновление образа снова попросит подтверждение.
        - name: "6h. Перезапуск в обычном режиме"
          ansible.builtin.command:
            argv: "{{ compose + ['up', '-d', 'db', 'server'] }}"
          changed_when: true

        - name: "6i. Убрать параметры первого запуска"
          ansible.builtin.file:
            path: "{{ tc_dir }}/upgrade.override.yaml"
            state: absent

        - name: "6j. Отметить первый запуск выполненным"
          ansible.builtin.copy:
            dest: "{{ upgrade_marker }}"
            owner: root
            group: root
            mode: '0644'
            content: "upgraded_to=2026.2\n"

    # --- Повторные запуски и после восстановления -----------------------------
    - name: "7a. TeamCity и PostgreSQL запущены"
      ansible.builtin.command:
        argv: "{{ compose + ['up', '-d', 'db', 'server'] }}"
      register: tc_compose_up
      changed_when: >-
        'Started' in (tc_compose_up.stderr ~ tc_compose_up.stdout)
        or 'Recreated' in (tc_compose_up.stderr ~ tc_compose_up.stdout)

    - name: "7b. Ждём TeamCity"
      ansible.builtin.command:
        argv: [curl, -s, -o, /dev/null, -w, '%{http_code}', "http://127.0.0.1:{{ tc_port }}/login.html"]
      register: tc_ready
      changed_when: false
      failed_when: false
      until: tc_ready.stdout == '200'
      retries: 120
      delay: 10

    - name: "7c. TeamCity отвечает через https"
      ansible.builtin.command:
        argv: [curl, -sk, -o, /dev/null, -w, '%{http_code}', --resolve, "{{ site_name }}:443:127.0.0.1", "https://{{ site_name }}/login.html"]
      register: tc_https
      changed_when: false
      failed_when: tc_https.stdout != '200'

    # Агенты и браузеры проверяют цепочку сертификата — проверяем так же.
    - name: "7d. Сертификат проверяется по доверенным УЦ"
      ansible.builtin.command:
        argv: [curl, -s, -o, /dev/null, -w, '%{http_code}', --resolve, "{{ site_name }}:443:127.0.0.1", "https://{{ site_name }}/login.html"]
      register: tc_https_verify
      changed_when: false
      failed_when: false

    - name: "7e. Предупреждение о цепочке сертификата"
      ansible.builtin.debug:
        msg: >-
          ВНИМАНИЕ: https работает, но сертификат не проверяется по доверенным УЦ на ВМ.
          Либо на ВМ нет корпоративного УЦ (00 без ca.crt), либо в files/tls/ сертификат без
          промежуточного УЦ. Агенты могут не подключиться: положите сертификат с цепочкой.
      when: tc_https_verify.stdout != '200'

    - name: Готово
      ansible.builtin.debug:
        msg: |
          TeamCity: {{ public_url }}  (http перенаправляется на https)
          Вход — пользователями старого сервера (из backup).

          Сразу после входа (это копия рабочего сервера):
            - Administration → Global Settings: проверьте Server URL = {{ public_url }};
            - на репетиции отключите триггеры сборок и уведомления.

          Агенты: в buildAgent.properties укажите serverUrl={{ public_url }}
          (Java агента должна доверять корпоративному УЦ), затем Agents → Unauthorized → Authorize.

          Журнал восстановления на ВМ: {{ tc_dir }}/restore.log
